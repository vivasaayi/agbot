name: Web CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  web-tests:
    name: Web tests and GIS acceptance
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: '1.93.1'
    - uses: Swatinem/rust-cache@v2

    - name: Install Linux build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev libudev-dev pkg-config

    - name: Validate delivery pipeline contract
      run: bash scripts/verify-delivery-pipeline.sh

    - name: Run web regression tests
      run: |
        cargo test --locked -p shared --lib
        cargo test --locked -p geo_hub --tests --lib
        bash scripts/test ui

    - name: Run GIS advisor acceptance workflow
      run: cargo test --locked -p geo_hub acceptance_

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: web-tests
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Validate Dockerfile pins and manifest
      run: |
        bash scripts/verify-container-build.sh
        bash scripts/verify-appliance-build.sh

    - name: Build appliance image
      uses: docker/build-push-action@v7
      with:
        context: .
        target: runtime-appliance
        platforms: linux/amd64
        load: true
        push: false
        tags: agbot-appliance-ci:${{ github.sha }}
        build-args: |
          AGRODRONE_COMMIT=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test appliance and web routes
      shell: bash
      run: |
        set -euo pipefail
        container_id="$(docker run -d -e GEO_HUB__SECURITY__REQUIRE_SESSION=true agbot-appliance-ci:${{ github.sha }})"
        trap 'docker rm -fv "$container_id" >/dev/null 2>&1 || true' EXIT
        for _ in $(seq 1 30); do
          if docker exec "$container_id" curl -fsS http://127.0.0.1:8080/ready >/dev/null 2>&1; then
            for route in /health / /app /portal/ /workspace/ /browse; do
              docker exec "$container_id" curl -fsS "http://127.0.0.1:8080$route" >/dev/null
            done
            status="$(docker exec "$container_id" curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/fields)"
            test "$status" = 401
            exit 0
          fi
          sleep 1
        done
        docker logs "$container_id"
        exit 1

    - name: Scan appliance vulnerabilities
      # v0.36.0 — immutable commit pin; do not use a mutable action tag here.
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: agbot-appliance-ci:${{ github.sha }}
        format: table
        exit-code: '1'
        ignore-unfixed: true
        severity: CRITICAL,HIGH
