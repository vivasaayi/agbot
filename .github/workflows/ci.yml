name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2

    - name: Scan plaintext secrets
      run: bash scripts/verify-secrets.sh

    - name: Validate ARM cross CI contract
      run: bash scripts/verify-arm-ci.sh

    - name: Validate delivery pipeline contract
      run: bash scripts/verify-delivery-pipeline.sh
    
    - name: Check formatting
      run: cargo fmt --all -- --check
      
    - name: Run clippy
      run: cargo clippy --locked --all-targets --all-features -- -D warnings
      
    - name: Run tests
      run: cargo test --locked --all-features

  gis:
    name: GIS acceptance
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2

    - name: Run GIS regression suite
      run: |
        cargo test --locked -p shared --lib
        cargo test --locked -p geo_hub --tests --lib
        cargo test --locked -p geo_viewer

    - name: Run GIS advisor acceptance workflow
      run: cargo test --locked -p geo_hub acceptance_

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v7

    - name: Audit Rust dependency advisories
      uses: rustsec/audit-check@v2.0.0

  flight-sim:
    name: Flight simulator regression
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v7

    - name: Configure and build canonical C++ simulator
      run: |
        cmake -S flight_sim_cpp -B flight_sim_cpp/build
        cmake --build flight_sim_cpp/build --parallel

    - name: Run deterministic simulator regressions
      run: ctest --test-dir flight_sim_cpp/build --output-on-failure

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    
    - name: Build
      run: cargo build --locked --release --all-features

  cross-compile:
    name: Cross Compile
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            just_recipe: arm64
            artifact_name: agbot-aarch64-jetson
          - target: armv7-unknown-linux-gnueabihf
            just_recipe: arm
            artifact_name: agbot-armv7-raspberry-pi
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - uses: docker/setup-qemu-action@v4
    
    - name: Install cross and just
      run: |
        cargo install cross --locked
        cargo install just --locked
      
    - name: Cross compile
      run: just ${{ matrix.just_recipe }}

    - name: Smoke boot target artifacts
      run: scripts/smoke-arm-artifacts.sh ${{ matrix.target }}

    - name: Package target artifacts
      run: scripts/package-arm-artifacts.sh ${{ matrix.target }}

    - name: Upload target artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/arm/${{ matrix.target }}/agbot-${{ matrix.target }}.tar.gz
        if-no-files-found: error

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, gis, security, flight-sim]
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Validate Dockerfile pins and manifest
      run: |
        bash scripts/verify-container-build.sh
        bash scripts/verify-appliance-build.sh
      
    - name: Build appliance image
      uses: docker/build-push-action@v7
      with:
        context: .
        target: runtime-appliance
        load: true
        push: false
        tags: agbot-appliance-ci:${{ github.sha }}
        build-args: |
          AGRODRONE_COMMIT=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke boot appliance health endpoint
      shell: bash
      run: |
        set -euo pipefail
        container_id="$(docker run -d -p 18080:8080 agbot-appliance-ci:${{ github.sha }})"
        trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
        for _ in $(seq 1 30); do
          if curl --fail --silent --show-error http://127.0.0.1:18080/health >/dev/null; then
            exit 0
          fi
          sleep 1
        done
        docker logs "$container_id"
        exit 1

    - name: Scan appliance vulnerabilities
      # v0.36.0 — immutable commit pin; do not use a mutable action tag here.
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: agbot-appliance-ci:${{ github.sha }}
        format: table
        exit-code: '1'
        ignore-unfixed: true
        severity: CRITICAL,HIGH
