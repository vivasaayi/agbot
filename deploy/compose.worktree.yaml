services:
  app:
    image: ${APP_IMAGE:?Supply the product image}
    build:
      context: ${PRODUCT_SOURCE}
      dockerfile: ${PRODUCT_DOCKERFILE:-Dockerfile}
      target: runtime-appliance
      args:
        AGRODRONE_COMMIT: ${AGBOT_SOURCE_COMMIT:-unknown}
    ports:
      - "${BIND_ADDRESS}:${PUBLISHED_PORT}:${APP_PORT}"
    environment:
      GEO_HUB__BOOTSTRAP__ACCESS_CODE: ${POSTGRES_PASSWORD:?Environment credential required}
      GEO_HUB__BOOTSTRAP__SEED_DEMO: "false"
      GEO_HUB__SECURITY__REQUIRE_SESSION: "true"
      GEO_HUB__SECURITY__RATE_LIMIT_PER_MIN: "120"
      GEO_HUB__PIPELINE__ENABLED: "true"
    volumes:
      - database:/opt/agbot/db
      - artifacts:/opt/agbot/data
    restart: "no"
volumes:
  database: {}
  artifacts: {}
