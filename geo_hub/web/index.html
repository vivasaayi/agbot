<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AGBot Workspace</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <style>
    :root {
      --bg: #16181d;
      --panel: #1e2128;
      --panel-border: #2c313a;
      --text: #d7dae0;
      --text-dim: #8b919c;
      --accent: #5b9e6f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    header .badge {
      color: var(--accent);
      font-size: 0.75rem;
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 0.1rem 0.4rem;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 240px 1fr 300px;
      min-height: 0;
    }

    .pane {
      overflow-y: auto;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      padding: 0.75rem;
    }

    .pane h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      margin-bottom: 0.6rem;
    }

    #map {
      background: var(--bg);
      border-right: 1px solid var(--panel-border);
      min-height: 0;
      display: flex;
    }

    #map-primary,
    #map-compare {
      flex: 1;
      min-width: 0;
    }

    #map-compare {
      border-left: 1px solid var(--panel-border);
    }

    #map-compare[hidden] {
      display: none;
    }

    .leaflet-container {
      background: #12141a;
    }

    .compare-toggle {
      margin-left: auto;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 0.2rem 0.6rem;
      cursor: pointer;
      font-size: 0.78rem;
    }

    .compare-toggle.active {
      color: var(--accent);
      border-color: var(--accent);
    }

    .compare-controls {
      display: flex;
      gap: 0.3rem;
      align-items: center;
    }

    .compare-controls input {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 0.2rem 0.4rem;
      font-size: 0.78rem;
    }

    .compare-controls button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .layer-row {
      display: grid;
      grid-template-columns: auto 1fr 80px;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0;
      font-size: 0.8rem;
    }

    .layer-row input[type="range"] {
      width: 80px;
    }

    .annotation-list {
      list-style: none;
      margin-top: 0.4rem;
    }

    .annotation-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.2rem 0;
      font-size: 0.8rem;
    }

    button.add-annotation,
    button.link-button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 0.2rem 0.45rem;
      cursor: pointer;
      font-size: 0.75rem;
    }

    button.link-button {
      color: #c96a5f;
      border: none;
      background: none;
    }

    .recommendation-list,
    .report-list,
    .lineage-list {
      list-style: none;
      margin: 0.3rem 0 0.6rem;
      font-size: 0.8rem;
    }

    .recommendation-list li {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.2rem 0;
    }

    .lineage-list {
      margin-left: 1rem;
      list-style: decimal;
      color: var(--text-dim);
    }

    .tag {
      color: var(--accent);
      font-size: 0.72rem;
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 0 0.3rem;
    }

    button.open-report {
      color: var(--accent);
      text-align: left;
    }

    .proposal-list {
      list-style: none;
      margin-top: 0.3rem;
    }

    .proposal-list li {
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 0.35rem 0.45rem;
      margin-bottom: 0.4rem;
    }

    .proposal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
    }

    .proposal-meta {
      color: var(--text-dim);
      font-size: 0.72rem;
      margin: 0.15rem 0 0.3rem;
    }

    .proposal-actions {
      display: flex;
      gap: 0.35rem;
    }

    .proposal-actions .accept,
    .proposal-actions .reject {
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      background: var(--bg);
      color: var(--text);
      padding: 0.15rem 0.5rem;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .proposal-actions .accept {
      border-color: var(--accent);
      color: var(--accent);
    }

    .proposal-actions .reject {
      color: #c96a5f;
    }

    .badge.status-accepted {
      color: var(--accent);
    }

    .badge.status-rejected {
      color: #c96a5f;
    }

    .provenance-form {
      display: flex;
      gap: 0.3rem;
      margin: 0.3rem 0;
    }

    .provenance-form input {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 0.2rem 0.4rem;
      font-size: 0.78rem;
    }

    .provenance-form button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      font-size: 0.75rem;
    }

    #inspector {
      border-right: none;
    }

    #inspector .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-bottom: 0.75rem;
    }

    #inspector .tab {
      font-size: 0.75rem;
      color: var(--text-dim);
      background: var(--bg);
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 0.2rem 0.5rem;
      cursor: default;
    }

    #catalog-tree ul {
      list-style: none;
      margin-left: 0.6rem;
    }

    #catalog-tree .tree-row {
      padding: 0.2rem 0.35rem;
      border-radius: 3px;
      cursor: pointer;
    }

    #catalog-tree .tree-row:hover {
      background: var(--bg);
    }

    #catalog-tree .tree-row.scene {
      color: var(--accent);
    }

    dl.detail {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.15rem 0.6rem;
      font-size: 0.78rem;
    }

    dl.detail dt {
      color: var(--text-dim);
    }

    dl.detail dd {
      word-break: break-word;
    }

    .status {
      color: var(--text-dim);
      font-style: italic;
    }

    .error {
      color: #c96a5f;
    }

    /* Ingestion & sources oversight panel. */
    .pipeline-heading {
      margin: 0.8rem 0 0.3rem;
      font-size: 0.82rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .pipeline-refresh {
      color: var(--accent);
      background: none;
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 0.15rem 0.5rem;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .pipeline-metrics {
      display: flex;
      gap: 0.5rem;
    }
    .pipeline-metric {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      padding: 0.35rem 0.2rem;
    }
    .pipeline-metric-value {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .pipeline-metric-label {
      font-size: 0.68rem;
      color: var(--text-dim);
    }
    .pipeline-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.74rem;
      margin-top: 0.2rem;
    }
    .pipeline-table th,
    .pipeline-table td {
      text-align: left;
      padding: 0.2rem 0.35rem;
      border-bottom: 1px solid var(--panel-border);
      vertical-align: top;
    }
    .pipeline-table th {
      color: var(--text-dim);
      font-weight: 600;
    }
    .tag-ok { color: #4f9d69; border-color: #4f9d69; }
    .tag-error { color: #c96a5f; border-color: #c96a5f; }
    .tag-info { color: #5f86c9; border-color: #5f86c9; }
    .tag-warn { color: #c9a15f; border-color: #c9a15f; }

    /* Per-level product browser (scene inspector). */
    .level-label {
      margin: 0.5rem 0 0.2rem;
      font-size: 0.76rem;
      color: var(--accent);
    }
    .level-product-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .level-product-list li {
      padding: 0.25rem 0;
      border-bottom: 1px solid var(--panel-border);
    }
    .level-product-row {
      font-size: 0.76rem;
    }
    .level-series {
      color: var(--accent);
      margin-top: 0.2rem;
    }
    .sparkline {
      display: block;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>AGBot Workspace</h1>
    <span class="badge">geo_hub</span>
    <button id="compare-toggle" class="compare-toggle">Compare</button>
    <form id="compare-controls" class="compare-controls" hidden>
      <input id="compare-scene" type="text" placeholder="compare scene id" />
      <button type="submit">Load</button>
      <span id="compare-status" class="status"></span>
    </form>
  </header>
  <main>
    <section class="pane" id="catalog" aria-label="Catalog">
      <h2>Catalog</h2>
      <div id="catalog-tree">
        <p class="status">Loading fields…</p>
      </div>
    </section>
    <section id="map" aria-label="Map">
      <div id="map-primary"></div>
      <div id="map-compare" hidden></div>
    </section>
    <section class="pane" id="inspector" aria-label="Inspector">
      <h2>Inspector</h2>
      <div class="tabs">
        <span class="tab" data-tab="layers">Layers</span>
        <span class="tab" data-tab="annotations">Annotations</span>
        <span class="tab" data-tab="recommendations">Recommendations</span>
        <span class="tab" data-tab="provenance">Provenance</span>
        <span class="tab" data-tab="alerts">Alerts</span>
        <span class="tab" data-tab="proposals">Proposals</span>
        <span class="tab" data-tab="pipeline">Pipeline</span>
      </div>
      <div id="layers-panel"></div>
      <div id="annotations-panel"></div>
      <div id="recommendations-panel"></div>
      <div id="findings-panel"></div>
      <div id="alerts-panel"></div>
      <div id="proposals-panel"></div>
      <div id="provenance-panel"></div>
      <div id="pipeline-panel"></div>
      <div id="scene-detail">
        <p class="status">Select a scene to inspect it.</p>
      </div>
    </section>
  </main>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
