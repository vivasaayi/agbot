<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AGBot Workspace</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <style>
    :root {
      --bg: #16181d;
      --panel: #1e2128;
      --panel-border: #2c313a;
      --text: #d7dae0;
      --text-dim: #8b919c;
      --accent: #5b9e6f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    header .badge {
      color: var(--accent);
      font-size: 0.75rem;
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 0.1rem 0.4rem;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 240px 1fr 300px;
      min-height: 0;
    }

    .pane {
      overflow-y: auto;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      padding: 0.75rem;
    }

    .pane h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      margin-bottom: 0.6rem;
    }

    #map {
      background: var(--bg);
      border-right: 1px solid var(--panel-border);
      min-height: 0;
    }

    .leaflet-container {
      background: #12141a;
    }

    .layer-row {
      display: grid;
      grid-template-columns: auto 1fr 80px;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0;
      font-size: 0.8rem;
    }

    .layer-row input[type="range"] {
      width: 80px;
    }

    .annotation-list {
      list-style: none;
      margin-top: 0.4rem;
    }

    .annotation-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.2rem 0;
      font-size: 0.8rem;
    }

    button.add-annotation,
    button.link-button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 0.2rem 0.45rem;
      cursor: pointer;
      font-size: 0.75rem;
    }

    button.link-button {
      color: #c96a5f;
      border: none;
      background: none;
    }

    .recommendation-list,
    .report-list,
    .lineage-list {
      list-style: none;
      margin: 0.3rem 0 0.6rem;
      font-size: 0.8rem;
    }

    .recommendation-list li {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.2rem 0;
    }

    .lineage-list {
      margin-left: 1rem;
      list-style: decimal;
      color: var(--text-dim);
    }

    .tag {
      color: var(--accent);
      font-size: 0.72rem;
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 0 0.3rem;
    }

    button.open-report {
      color: var(--accent);
      text-align: left;
    }

    #inspector {
      border-right: none;
    }

    #inspector .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-bottom: 0.75rem;
    }

    #inspector .tab {
      font-size: 0.75rem;
      color: var(--text-dim);
      background: var(--bg);
      border: 1px solid var(--panel-border);
      border-radius: 3px;
      padding: 0.2rem 0.5rem;
      cursor: default;
    }

    #catalog-tree ul {
      list-style: none;
      margin-left: 0.6rem;
    }

    #catalog-tree .tree-row {
      padding: 0.2rem 0.35rem;
      border-radius: 3px;
      cursor: pointer;
    }

    #catalog-tree .tree-row:hover {
      background: var(--bg);
    }

    #catalog-tree .tree-row.scene {
      color: var(--accent);
    }

    dl.detail {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.15rem 0.6rem;
      font-size: 0.78rem;
    }

    dl.detail dt {
      color: var(--text-dim);
    }

    dl.detail dd {
      word-break: break-word;
    }

    .status {
      color: var(--text-dim);
      font-style: italic;
    }

    .error {
      color: #c96a5f;
    }
  </style>
</head>
<body>
  <header>
    <h1>AGBot Workspace</h1>
    <span class="badge">geo_hub</span>
  </header>
  <main>
    <section class="pane" id="catalog" aria-label="Catalog">
      <h2>Catalog</h2>
      <div id="catalog-tree">
        <p class="status">Loading fields…</p>
      </div>
    </section>
    <section id="map" aria-label="Map"></section>
    <section class="pane" id="inspector" aria-label="Inspector">
      <h2>Inspector</h2>
      <div class="tabs">
        <span class="tab" data-tab="layers">Layers</span>
        <span class="tab" data-tab="annotations">Annotations</span>
        <span class="tab" data-tab="recommendations">Recommendations</span>
        <span class="tab" data-tab="provenance">Provenance</span>
        <span class="tab" data-tab="alerts">Alerts</span>
        <span class="tab" data-tab="proposals">Proposals</span>
      </div>
      <div id="layers-panel"></div>
      <div id="annotations-panel"></div>
      <div id="recommendations-panel"></div>
      <div id="scene-detail">
        <p class="status">Select a scene to inspect it.</p>
      </div>
    </section>
  </main>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
