# Production deployment for the geo_hub appliance (farmer portal + web
# workspace/browse + APIs + satellite ingestion). SQLite-backed, single
# service, no Postgres. Driven by the `agbot` CLI, which resolves the image
# tag for the selected channel and writes the .env consumed here.
#
#   AGBOT_IMAGE        full image ref, e.g. ghcr.io/vivasaayi/geo-hub:latest
#   AGBOT_PORT         host port to expose the portal on (default 8080)
#   AGBOT_ADMIN_TOKEN  bearer token that unlocks the admin access-code API
#                      (mint / list / revoke). Unset by default → the admin
#                      API is disabled (fail-closed, 403); first-run portal
#                      login still works via the bootstrap access code. Set a
#                      strong random value before issuing codes to real users.
#
# State lives in named volumes so `agbot upgrade` can re-pull the image
# without losing the database or ingested data.

services:
  geo_hub:
    image: ${AGBOT_IMAGE:-ghcr.io/vivasaayi/geo-hub:latest}
    container_name: agbot-geo-hub
    restart: unless-stopped
    ports:
      - "${AGBOT_PORT:-8080}:8080"
    environment:
      # The image bakes absolute GEO_HUB__* defaults; override here only to
      # opt into the pipeline worker or point at a different runtime mode.
      GEO_HUB__PIPELINE__ENABLED: ${AGBOT_PIPELINE_ENABLED:-false}
      GEO_HUB__RUNTIME_MODE: ${AGBOT_RUNTIME_MODE:-local}
      # Admin access-code API bearer token. Empty → API disabled (fail-closed).
      GEO_HUB__SECURITY__ADMIN_TOKEN: ${AGBOT_ADMIN_TOKEN:-}
      # Require a valid portal session on every /api/* route (anonymous → 401).
      # Off by default; turn on once the portal is exposed beyond a trusted LAN.
      GEO_HUB__SECURITY__REQUIRE_SESSION: ${AGBOT_REQUIRE_SESSION:-false}
      # Per-client-IP request cap over a 60s window (0 disables). Requires the
      # reverse proxy to forward the real client IP for meaningful buckets.
      GEO_HUB__SECURITY__RATE_LIMIT_PER_MIN: ${AGBOT_RATE_LIMIT_PER_MIN:-0}
      # Delete a product's artifact as it is superseded so regenerated rasters
      # don't fill the data volume. On by default for the appliance.
      GEO_HUB__STORAGE__DELETE_SUPERSEDED_ARTIFACTS: ${AGBOT_DELETE_SUPERSEDED:-true}
      # Structured JSON logs for aggregation (RUST_LOG still sets levels).
      GEO_HUB__OBSERVABILITY__LOG_FORMAT: ${AGBOT_LOG_FORMAT:-json}
      RUST_LOG: ${AGBOT_RUST_LOG:-info}
    volumes:
      - geo_hub_db:/opt/agbot/db
      - geo_hub_data:/opt/agbot/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  geo_hub_db:
  geo_hub_data:
